name: Bot Engulfing

on:
  schedule:
    - cron: "27 23 * * *"     # todos los dias, UTC (la cripto opera fines de semana)
  workflow_dispatch:
    inputs:
      test_telegram:
        description: "Solo probar la conexion con Telegram"
        type: boolean
        default: false
      demo:
        description: "Enviar UN mensaje de ejemplo con una senal HISTORICA (no vigente)"
        type: boolean
        default: false
      historial:
        description: "Listar senales de las ultimas N velas, sin enviar nada (0 = ejecucion normal)"
        type: string
        default: "0"

permissions:
  contents: write            # necesario para guardar state/engulfing.json

concurrency:
  group: bot-engulfing          # un grupo por bot: no se cancelan entre ellos
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TOKEN_ENGULFING }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TICKERS: "NVDA,AAPL,MSFT,BTC-USD,ETH-USD,GC=F,EURUSD=X"   # edita aqui los activos de este bot
      REPORTE_DIARIO: "1"            # "0" para desactivar el reporte de cierre
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Probar Telegram
        if: ${{ inputs.test_telegram == true }}
        run: python run_bot.py engulfing --test-telegram

      - name: Enviar mensaje de demostracion
        if: ${{ inputs.test_telegram != true && inputs.demo == true }}
        run: python run_bot.py engulfing --demo

      - name: Listar historial de senales
        if: ${{ inputs.test_telegram != true && inputs.demo != true && inputs.historial != '' && inputs.historial != '0' }}
        run: python run_bot.py engulfing --historial ${{ inputs.historial }}

      - name: Analizar acciones y enviar alertas
        if: ${{ inputs.test_telegram != true && inputs.demo != true && (inputs.historial == '' || inputs.historial == '0') }}
        run: python run_bot.py engulfing

      - name: Guardar estado
        if: ${{ always() && inputs.test_telegram != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/engulfing.json
          if git diff --cached --quiet; then
            echo "Sin cambios de estado"
          else
            git commit -m "estado: engulfing"
            for i in 1 2 3; do
              git pull --rebase && git push && break
              sleep 5
            done
          fi
