name: Bot Inside Bar

on:
  schedule:
    - cron: "22 23 * * 1-5"   # lunes a viernes, UTC (despues del cierre de EE. UU.)
  workflow_dispatch:
    inputs:
      test_telegram:
        description: "Solo probar la conexion con Telegram"
        type: boolean
        default: false
      historial:
        description: "Listar senales de las ultimas N velas, sin enviar nada (0 = ejecucion normal)"
        type: string
        default: "0"

permissions:
  contents: write            # necesario para guardar state/inside_bar.json

concurrency:
  group: bot-inside_bar          # un grupo por bot: no se cancelan entre ellos
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TOKEN_INSIDE_BAR }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TICKERS: "NVDA,AAPL,MSFT,GC=F,BTC-USD,EURUSD=X"
      # cambia aqui las 3 acciones de este bot
      REPORTE_DIARIO: "1"            # "0" para desactivar el reporte de cierre
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Probar Telegram
        if: ${{ inputs.test_telegram == true }}
        run: python run_bot.py inside_bar --test-telegram

      - name: Listar historial de senales
        if: ${{ inputs.test_telegram != true && inputs.historial != '' && inputs.historial != '0' }}
        run: python run_bot.py inside_bar --historial ${{ inputs.historial }}

      - name: Analizar acciones y enviar alertas
        if: ${{ inputs.test_telegram != true && (inputs.historial == '' || inputs.historial == '0') }}
        run: python run_bot.py inside_bar

      - name: Guardar estado
        if: ${{ always() && inputs.test_telegram != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/inside_bar.json
          if git diff --cached --quiet; then
            echo "Sin cambios de estado"
          else
            git commit -m "estado: inside_bar"
            for i in 1 2 3; do
              git pull --rebase && git push && break
              sleep 5
            done
          fi
